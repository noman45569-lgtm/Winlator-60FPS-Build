# --- PERFORMANCE OPTIMIZATION FOR MOBILE (90 FPS TARGET) ---
# Engine settings for high performance
enable_dynamic_lighting = 1
max_number_of_lights_on_scene = 4
force_directx_version = 7
# 100 Army size optimization
battle_size_max = 100
# GPU Load Reduction
lod_multiplier = 0.5
# Grass removal for FPS
grass_species_count = 0
# Particle and Blood settings
blood_multiplier = 1
# Disable unnecessary heavy features
disable_bloom = 1
disable_shadows = 0
enable_blood = 1
